version: '3.8'

services:
  dynamodb-export:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-splaysh-items}
      - S3_BUCKET=${S3_BUCKET:-splaysh-static-data}
      - ADMIN_ROLE_ARN=${ADMIN_ROLE_ARN}
    volumes:
      - ./logs:/app/logs
    restart: on-failure
